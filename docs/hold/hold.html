<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hold Task</title>
    <link rel="stylesheet" href="hold.css?v=107" />
    <script type="module" src="hold.js?v=107" defer></script>
</head>

<body>
    <header id="taskHeader">
        <h2>✋ Hold Task</h2>
    </header>

    <div class="instruction-container">
        <p id="holdInstruction">Press <strong class="highlight-instruction">Start</strong> and immediately <strong class="highlight-instruction">hold</strong> the blue circle<br>with your index finger</p>
        <p id="timerLine" class="timer-line" style="display:none;">Time remaining: <span id="timerBadge" class="timer-badge">10</span> seconds</p>
        <button id="watchExampleBtn" class="watch-example-btn" style="display:none;">Watch Example</button>
        <div id="attemptsCounter" class="attempts-container" style="display:none;"></div>
    </div>

    <div id="holdArea">
        <div id="pressureGaugeContainer" style="display: none;">
            <p id="pressureFeedbackText">Force: Optimal</p>
            <div id="pressureGaugeBar">
                <div id="pressureGaugeFill"></div>
            </div>
        </div>

        <div id="holdTarget"></div>
        <button id="startTaskButton" style="display: none;">Start</button>
    </div>

    <div id="practiceOptionsOverlay" class="practice-options-overlay" style="display:none;">
        <div id="practiceOptionsContainer" class="practice-options-container">
            <button id="tryItButton" class="practice-option-btn practice-option-primary">Start Practice</button>
            <button id="watchVideoBtn" class="practice-option-btn practice-option-secondary">Watch Video</button>
        </div>
    </div>

    <!-- Modal for GIF -->
    <div id="gifModal" class="modal" style="display:none;">
        <div class="gif-modal-content">
            <div class="gif-container">
                <img id="gifDemoImage" src="hold.gif" class="gif-image" alt="Instructional Demo">
            </div>
            <h3 id="gifPromptTitle" class="gif-prompt-title" style="display:none;">Are you ready to try it yourself?</h3>
            <div id="gifBtnGroup" class="gif-btn-group" style="display:none;">
                <button id="gifBtnYes" class="gif-btn-yes">Yes, I'm ready</button>
                <button id="gifBtnAgain" class="gif-btn-again">Watch Again</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="resultsModal" class="modal" style="display:none;">
        <div class="modal-content" id="modalContentArea">
            <div class="modal-header">
                <span class="modal-title">Hold Results</span>
                <span id="modalCloseX" class="modal-close">&times;</span>
            </div>
            <div class="modal-body" id="modalBodyContent"></div>
            <div class="modal-footer">
                <button id="modalCloseButton">Close</button>
            </div>
        </div>
    </div>
    <div id="completionBox" style="display:none;">
        <p id="completionText">✅ Practice Complete</p>

        <button id="nextTaskButton">
            Finish Tasks
        </button>
    </div>
    <script>
        const modal = document.getElementById("resultsModal");
        const closeBtn = document.getElementById("modalCloseButton");
        const closeX = document.getElementById("modalCloseX");

        window.isModalOpen = false;

        // --- Show Modal ---
        window.showModal = function () {
            modal.classList.add("show");
            modal.style.display = "block";
            document.body.classList.add("modal-open");
            window.isModalOpen = true;
        };

        // --- Close Modal ---
        window.closeModal = function () {
            modal.classList.remove("show");
            modal.style.display = "none";
            document.body.classList.remove("modal-open");
            window.isModalOpen = false;
        };

        // --- Event listeners ---
        [closeBtn, closeX].forEach(btn => {
            if (btn) btn.addEventListener("click", e => {
                e.stopPropagation();
                window.closeModal();
            });
        });

        // Prevent accidental background closing
        modal.addEventListener("touchstart", e => e.stopPropagation(), true);
        modal.addEventListener("touchmove", e => e.stopPropagation(), true);
        modal.addEventListener("touchend", e => e.stopPropagation(), true);
    </script>
</body>

</html>
