<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hold Task</title>
    <link rel="stylesheet" href="hold.css">
    <script type="module" src="hold.js" defer></script>
</head>

<body>
    <!-- Header -->
    <header id="taskHeader">
        <h2>✋ Hold Task</h2>
        <p>Tap and hold the circle steadily for 5 seconds without moving.</p>
    </header>

    <!-- Hold Area -->
    <div id="holdArea">
        <div id="holdTarget"></div>
        <p id="holdInstruction">Touch and hold inside the blue circle</p>
    </div>

    <!-- Modal -->
    <div id="resultsModal" class="modal" style="display:none;">
        <div class="modal-content" id="modalContentArea">
            <div class="modal-header">
                <span class="modal-title">Hold Results</span>
                <span id="modalCloseX" class="modal-close">&times;</span>
            </div>
            <div class="modal-body" id="modalBodyContent"></div>
            <div class="modal-footer">
                <button id="modalCloseButton">Close</button>
            </div>
        </div>
    </div>

    <!-- Next Task -->
    <button id="nextTaskButton" style="display:none;" onclick="window.location.href='/docs/end/summary.html'">
        Finish Tasks
    </button>

    <script>
        const modal = document.getElementById("resultsModal");
        const closeBtn = document.getElementById("modalCloseButton");
        const closeX = document.getElementById("modalCloseX");
        const holdTarget = document.getElementById("holdTarget");

        window.isModalOpen = false;

        // --- Show Modal ---
        window.showModal = function () {
            modal.classList.add("show");
            modal.style.display = "block";
            document.body.classList.add("modal-open");
            window.isModalOpen = true;
        };

        // --- Close Modal ---
        window.closeModal = function () {
            modal.classList.remove("show");
            modal.style.display = "none";
            document.body.classList.remove("modal-open");
            window.isModalOpen = false;
        };

        // --- Event listeners ---
        if (closeBtn) {
            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                window.closeModal();
            });
        }

        if (closeX) {
            closeX.addEventListener('click', (e) => {
                e.stopPropagation();
                window.closeModal();
            });
        }

        // Prevent accidental background closing
        modal.addEventListener('touchstart', e => e.stopPropagation(), true);
        modal.addEventListener('touchmove', e => e.stopPropagation(), true);
        modal.addEventListener('touchend', e => e.stopPropagation(), true);
    </script>

</body>

</html>
