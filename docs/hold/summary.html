<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Task Summary</title>
    <style>
        html, body {
            touch-action: none;
            -webkit-text-size-adjust: 100%;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        body, * {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            user-select: none;
            touch-action: none;
        }
    </style>
    <script type="module">
        import { supabase } from "../client/supabaseClient.js";

        async function startNewSession() {
            const { data: { user } } = await supabase.auth.getUser();

            if (!user) {
                console.log("Not user");
                window.location.href = "../index.html";
                return;
            }

            const participantId = user.id;

            // Remove existing session from sessionStorage
            sessionStorage.removeItem(`session_${participantId}`);
            window.CURRENT_SESSION_ID = null;

            // Redirect back to dashboard
            window.location.href = "../dashboard/dashboard.html";
        }

        window.startNewSession = startNewSession;
    </script>
</head>

<body>
    <header>
        <h3>Task Summary</h3>
    </header>

    <main>
        <section id="summary">
            <p>
                Thank you for completing the tasks.
            </p>

            <button onclick="startNewSession()" style="padding:10px 20px; font-size:16px;">
                Return to Dashboard
            </button>
        </section>
    <script>
        // Prevent long-press context menu globally
        document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

        // Prevent pinch zoom gestures
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (evt) {
            document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
        });

        // Prevent multi-touch zoom
        document.addEventListener("touchstart", function (e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener("touchmove", function (e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        // Prevent double-tap zoom
        var lastTouchEnd = 0;
        document.addEventListener("touchend", function (e) {
            var now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
    </script>
</body>

</html>
