<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../drag/drag.css" rel="stylesheet" />
    <title>Adaptive Drag Task</title>

    <script type="module" src="adaptive_drag.js" defer></script>
</head>

<body>
    <header id="taskHeader">
        <h2>🖐️ Adaptive Drag Task</h2>
        <p>Drag from <strong>Start</strong> to <strong>Target</strong>. The target will move to a new position
            automatically after each drag.</p>
    </header>

    <div id="startPoint">
        <div id="startInnerDot"></div>
        <span class="label">Start</span>
    </div>

    <div id="targetPoint">
        <div id="targetInnerDot"></div>
        <div class="label">Target</div>
    </div>

    <!-- Modal -->
    <div id="resultsModal" class="modal" style="display:none;">
        <div class="modal-content" id="modalContentArea">
            <div class="modal-header">
                <span class="modal-title">Adaptive Drag Results</span>
                <span id="modalCloseX" class="modal-close">&times;</span>
            </div>
            <div class="modal-body" id="modalBodyContent"></div>
            <div class="modal-footer">
                <button id="modalCloseButton">Close</button>
            </div>
        </div>
    </div>

    <!-- Next Task Button -->
    <button id="nextTaskButton" style="display:none;" onclick="window.location.href='/ResearchProject/tap/tap.html'">
        Next: Tap Task
    </button>

    <canvas id="pathCanvas" width="100%" height="100%"
        style="position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none;">
    </canvas>

    <!-- Modal logic -->
    <script>
        const modal = document.getElementById("resultsModal");
        const closeBtn = document.getElementById("modalCloseButton");
        const closeX = document.getElementById("modalCloseX");
        window.isModalOpen = false;

        window.showModal = function () {
            modal.classList.add("show");
            modal.style.display = "block";
            document.body.classList.add("modal-open");
            window.isModalOpen = true;
        };

        window.closeModal = function () {
            modal.classList.remove("show");
            modal.style.display = "none";
            document.body.classList.remove("modal-open");
            window.isModalOpen = false;
        };

        closeBtn.addEventListener('click', window.closeModal);
        closeX.addEventListener('click', window.closeModal);
    </script>
</body>

</html>
