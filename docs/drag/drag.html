<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="drag.css" rel="stylesheet" />
    <title>Drag Task</title>

    <!-- <script type="module" src="app.js" defer></script> -->
    <script type="module" src="drag.js" defer></script>
</head>

<body>
    <header id="taskHeader">
        <h2>🖐️ Drag Task</h2>
    </header>
    <div id="mainContainer">
        <div id="instructionBox">
            <p id="instructionMain">Use your Index finger to drag from Start to Target<br><strong class="highlight-instruction">as fast</strong> and accurately as possible.</p>
            <p id="instructionSub"></p>
            <div id="watchExampleIndicator" class="watch-example-indicator" style="display:none;">Watch the example below</div>
        </div>
    </div>

    <div id="startPoint">
        <div id="startInnerDot"></div>
        <span class="label">Start</span>
    </div>

    <div id="targetPoint">
        <div id="targetInnerDot"></div>
        <div class="label">Target</div>
    </div>

    <div id="practiceOptionsOverlay" class="practice-options-overlay" style="display:none;">
        <div id="practiceOptionsContainer" class="practice-options-container">
            <button id="tryItButton" class="practice-option-btn practice-option-primary">Start Practice</button>
            <button id="watchVideoBtn" class="practice-option-btn practice-option-secondary">Watch Video</button>
        </div>
    </div>

    <div id="gifModal" class="modal" style="display:none;">
        <div class="gif-modal-content">
            <div class="gif-container">
                <img id="gifDemoImage" src="drag.gif" class="gif-image" alt="Instructional Demo">
            </div>
            <p class="gif-prompt-title" id="gifPromptTitle" style="display:none;">Are you ready to try it now?</p>
            <div class="gif-btn-group" id="gifBtnGroup" style="display:none;">
                <button class="gif-btn gif-btn-primary" id="gifBtnYes">Yes, I'm ready</button>
                <button class="gif-btn gif-btn-secondary" id="gifBtnAgain">Watch again</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="resultsModal" class="modal" style="display:none;">
        <div class="modal-content" id="modalContentArea">
            <div class="modal-header">
                <span class="modal-title">Drag Results</span>
                <span id="modalCloseX" class="modal-close">&times;</span>
            </div>

            <div class="modal-body" id="modalBodyContent"></div>

            <div class="modal-footer">
                <button id="modalCloseButton">Close</button>
            </div>
        </div>
    </div>
    <!-- <button id="nextTaskButton" style="display:none;" onclick="window.location.href='/docs/drag/adaptive_drag.html'"> -->
    <div id="completionBox" style="display:none; cursor: pointer;" onclick="window.location.href='../tap/tap.html'">
        <p id="completionText">✅ Task Complete</p>
        <button id="nextTaskButton" style="display:none;" onclick="window.location.href='../tap/tap.html'">
            Next: Tap Task
        </button>
    </div>


    <div id="fetchedDataContainer" class="fetched-data-container"></div>
    <canvas id="pathCanvas" width="100%" height="100%"
        style="position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none;">
    </canvas>

    <!-- Modal logic -->
    <script>
        const modal = document.getElementById("resultsModal");
        const closeBtn = document.getElementById("modalCloseButton");
        const closeX = document.getElementById("modalCloseX");
        const canvas = document.getElementById("pathCanvas");

        window.isModalOpen = false;

        // --- Show Modal ---
        window.showModal = function () {
            modal.classList.add("show");
            modal.style.display = "block";
            document.body.classList.add("modal-open");
            window.isModalOpen = true;
        };
        // --- Close Modal ---
        window.closeModal = function () {
            modal.classList.remove("show");
            modal.style.display = "none";
            document.body.classList.remove("modal-open");
            window.isModalOpen = false;
            window.trialReadyTime = Date.now();
        };
        // --- Event listeners ---
        window.addEventListener('click', function (event) {
            if (event.target === modal) window.closeModal();
        });

        closeBtn.addEventListener('click', window.closeModal);
        closeX.addEventListener('click', window.closeModal);

        modal.addEventListener('touchstart', e => e.stopPropagation(), true);
        modal.addEventListener('touchmove', e => e.stopPropagation(), true);
        modal.addEventListener('touchend', e => e.stopPropagation(), true);
    </script>
</body>

</html>
