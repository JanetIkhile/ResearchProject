<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Task</title>
    <link rel="stylesheet" href="tap.css?v=2">
    <script type="module" src="tap.js" defer></script>
</head>

<body>
    <!-- Header -->
    <header id="taskHeader">
        <h2>👆 Tap Task</h2>
    </header>
    <!-- Tap Area -->
    <div id="tapArea">
        <div class="instruction-container">
            <p id="tapInstruction">Use your index finger to tap the blue circle<br>alternatively <strong class="highlight-instruction">as fast as possible</strong>!</p>
            <p id="countdownTimer" style="display:none;"></p>
            <div id="watchExampleIndicator" class="watch-example-indicator" style="display:none;">Watch the example below</div>
            <p id="timerLine" class="timer-line" style="display:none;">Time remaining: <span id="timerBadge" class="timer-badge">10</span> seconds</p>
            <div id="attemptsCounter" class="attempts-container" style="display:none;"></div>
        </div>
        <div id="topTarget" class="tap-target active"></div>
        <div id="bottomTarget" class="tap-target inactive"></div>
    </div>

    <div id="practiceOptionsOverlay" class="practice-options-overlay" style="display:none;">
        <div id="practiceOptionsContainer" class="practice-options-container">
            <button id="tryItButton" class="practice-option-btn practice-option-primary">Start Practice</button>
            <button id="watchVideoBtn" class="practice-option-btn practice-option-secondary">Watch Video</button>
        </div>
    </div>

    <div id="gifModal" class="modal" style="display:none;">
        <div class="gif-modal-content">
            <div class="gif-container">
                <img id="gifDemoImage" src="tap.gif" class="gif-image" alt="Instructional Demo">
            </div>
            <p class="gif-prompt-title" id="gifPromptTitle" style="display:none;">Are you ready to try it now?</p>
            <div class="gif-btn-group" id="gifBtnGroup" style="display:none;">
                <button class="gif-btn gif-btn-primary" id="gifBtnYes">Yes, I'm ready</button>
                <button class="gif-btn gif-btn-secondary" id="gifBtnAgain">Watch again</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="resultsModal" class="modal" style="display:none;">
        <div class="modal-content" id="modalContentArea">
            <div class="modal-header">
                <span class="modal-title">Tap Results</span>
                <span id="modalCloseX" class="modal-close">&times;</span>
            </div>
            <div class="modal-body" id="modalBodyContent"></div>
            <div class="modal-footer">
                <button id="modalCloseButton">Close</button>
            </div>
        </div>
    </div>
    <div id="completionBox" style="display:none; cursor: pointer;" onclick="window.location.href='../pinch/pinch.html'">
        <p id="completionText">✅ Task Complete</p>

        <button id="nextTaskButton" onclick="window.location.href='../pinch/pinch.html'">
            Next: Pinch Task
        </button>
    </div>

    <!-- Modal logic -->
    <script>
        const modal = document.getElementById("resultsModal");
        const closeBtn = document.getElementById("modalCloseButton");
        const closeX = document.getElementById("modalCloseX");
        window.isModalOpen = false;

        // --- Show Modal ---
        window.showModal = function () {
            modal.classList.add("show");
            modal.style.display = "block";
            document.body.classList.add("modal-open");
            window.isModalOpen = true;
        };

        // --- Close Modal ---
        window.closeModal = function () {
            modal.classList.remove("show");
            modal.style.display = "none";
            document.body.classList.remove("modal-open");
            window.isModalOpen = false;
        };

        // --- Event listeners ---
        if (closeBtn) {
            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                window.closeModal();
            });
        }

        if (closeX) {
            closeX.addEventListener('click', (e) => {
                e.stopPropagation();
                window.closeModal();
            });
        }

        // Prevent accidental background closing
        modal.addEventListener('touchstart', e => e.stopPropagation(), true);
        modal.addEventListener('touchmove', e => e.stopPropagation(), true);
        modal.addEventListener('touchend', e => e.stopPropagation(), true);
    </script>
</body>

</html>
