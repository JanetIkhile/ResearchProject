<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motor Performance System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 0.3em;
      color: #003366;
    }

    p {
      color: #444;
      max-width: 420px;
      margin-bottom: 2em;
    }

    .task-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 240px;
    }

    .task-btn {
      background-color: #007bff;
      border: none;
      color: white;
      padding: 15px;
      font-size: 1.1em;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .task-btn:hover {
      background-color: #005fcc;
    }
  </style>
</head>

<body>
  <h1>Motor Performance Assessment</h1>
  <p>Select a task to begin. Each task measures different components of movement performance.</p>

  <div class="task-buttons">
    <button class="task-btn" onclick="location.href='drag/drag.html'">🖐️ Drag Task</button>
    <button class="task-btn" onclick="location.href='tap/tap.html'">👆 Tap Task</button>
    <button class="task-btn" onclick="location.href='hold/hold.html'">✊ Hold Task</button>
  </div>
</body>

</html>
