<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinch Task</title>
    <link rel="stylesheet" href="pinch.css?v=8">
    <script type="module" src="pinch.js?v=6" defer></script>
</head>

<body>
    <!-- Header -->
    <header id="taskHeader">
        <h2>🤏 Pinch Task</h2>
    </header>

    <!-- Pinch Area -->
    <div id="pinchArea">
        <div class="instruction-container">
            <p id="pinchInstruction">Place your thumb on the bottom circle and your index finger on the top circle. Open and close your fingers <strong class="highlight-instruction">as widely</strong> and <strong class="highlight-instruction">as quickly</strong> as possible.</p>
            <p id="countdownTimer">Time remaining: <span class="timer-badge">10</span> seconds</p>
        </div>
        

         <div id="topTarget" class="pinch-target"></div>
        <div id="bottomTarget" class="pinch-target"></div>
        
        <!-- Live distance floating label -->
        <div id="liveDistanceLabel" style="display:none;">0 mm</div>
    </div>

    <!-- Modal for feedback -->
    <div id="resultsModal" class="modal" style="display:none;">
        <div class="modal-content" id="modalContentArea">
            <div class="modal-header">
                <span class="modal-title">Pinch Results</span>
                <span id="modalCloseX" class="modal-close">&times;</span>
            </div>
            <div class="modal-body" id="modalBodyContent"></div>
            <div class="modal-footer">
                <button id="modalCloseButton">Close</button>
            </div>
        </div>
    </div>

    <!-- Completion routing -->
    <div id="completionBox" style="display:none;">
        <p id="completionText">✅ Task Complete</p>
        <button id="nextTaskButton" onclick="window.location.href='../hold/hold.html'">
            Next: Hold Task
        </button>
    </div>

    <script>
        const modal = document.getElementById("resultsModal");
        const closeBtn = document.getElementById("modalCloseButton");
        const closeX = document.getElementById("modalCloseX");
        window.isModalOpen = false;

        window.showModal = function () {
            modal.classList.add("show");
            modal.style.display = "block";
            document.body.classList.add("modal-open");
            window.isModalOpen = true;
        };

        window.closeModal = function () {
            modal.classList.remove("show");
            modal.style.display = "none";
            document.body.classList.remove("modal-open");
            window.isModalOpen = false;
        };

        if (closeBtn) {
            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                window.closeModal();
            });
        }

        if (closeX) {
            closeX.addEventListener('click', (e) => {
                e.stopPropagation();
                window.closeModal();
            });
        }

        modal.addEventListener('touchstart', e => e.stopPropagation(), true);
        modal.addEventListener('touchmove', e => e.stopPropagation(), true);
        modal.addEventListener('touchend', e => e.stopPropagation(), true);
    </script>
</body>

</html>
