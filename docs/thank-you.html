<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body, * {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding-top: clamp(120px, 15vh, 180px);
        }

        .container {
            max-width: 600px;
            padding: 20px;
        }

        .emoji {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 3.2rem);
            color: #16a34a;
            margin-bottom: 20px;
        }

        p {
            font-size: clamp(1.4rem, 2.8vw, 1.8rem);
            color: #374151;
            margin-bottom: 14px;
        }

        @media (min-width: 600px) {
            h1 {
                font-size: 3rem;
            }

            p {
                font-size: 1.7rem;
            }

            .emoji {
                font-size: 3.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎉 Congratulations!</h1>

        <p>You have successfully completed all tasks.</p>
        <p>Thank you — this was extremely helpful!</p>
        
        <button id="closeBtn" style="margin-top: 20px; padding: 15px 30px; font-size: 1.5rem; background-color: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer;">Close Application</button>
    </div>
    <script>
        document.getElementById("closeBtn").addEventListener("click", () => {
            // Browsers often block window.close() unless opened by script.
            window.close();
            // Fallback message if window doesn't close:
            setTimeout(() => {
                alert("You may now safely close this browser tab or application.");
            }, 300);
        });
        // Prevent long-press context menu globally
        document.addEventListener("contextmenu", function(e) { e.preventDefault(); });
    </script>
</body>

</html>
