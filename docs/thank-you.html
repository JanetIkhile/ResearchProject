<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>

    <style>
        @font-face {
            font-family: 'Selawik';
            src: url('assets/fonts/selawk.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Selawik';
            src: url('assets/fonts/selawkb.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        @font-face {
            font-family: 'Selawik';
            src: url('assets/fonts/selawkl.ttf') format('truetype');
            font-weight: 300;
            font-style: normal;
        }

        body, * {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        body {
            margin: 0;
            font-family: 'Selawik', Arial, Helvetica, sans-serif;
            background-color: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        button, input, select, textarea {
            font-family: inherit;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
        }

        .emoji {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 3.2rem);
            color: #16a34a;
            margin-bottom: 20px;
        }

        p {
            font-size: clamp(1.4rem, 2.8vw, 1.8rem);
            color: #374151;
            margin-bottom: 14px;
        }

        @media (min-width: 600px) {
            h1 {
                font-size: 3rem;
            }

            p {
                font-size: 1.7rem;
            }

            .emoji {
                font-size: 3.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎉 Congratulations!</h1>

        <p>You have successfully completed all tasks.</p>
        <p>Thank you — this was extremely helpful!</p>
        
        <button id="closeBtn" style="margin-top: 20px; padding: 15px 30px; font-size: 1.5rem; background-color: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer;">Close Application</button>
    </div>
    <script>
        document.getElementById("closeBtn").addEventListener("click", () => {
            // Browsers often block window.close() unless opened by script.
            window.close();
            // Fallback message if window doesn't close:
            setTimeout(() => {
                alert("You may now safely close this browser tab or application.");
            }, 300);
        });
        // Prevent long-press context menu globally
        document.addEventListener("contextmenu", function(e) { e.preventDefault(); });
    </script>
</body>

</html>
