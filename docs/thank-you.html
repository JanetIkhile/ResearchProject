<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f3f4f6;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding-top: clamp(120px, 15vh, 180px);
        }

        .container {
            max-width: 600px;
            padding: 20px;
        }

        .emoji {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 3.2rem);
            color: #16a34a;
            margin-bottom: 20px;
        }

        p {
            font-size: clamp(1.4rem, 2.8vw, 1.8rem);
            color: #374151;
            margin-bottom: 14px;
        }

        @media (min-width: 600px) {
            h1 {
                font-size: 3rem;
            }

            p {
                font-size: 1.7rem;
            }

            .emoji {
                font-size: 3.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎉 Congratulations!</h1>

        <p>You have successfully completed all tasks.</p>
        <p>Thank you — this was extremely helpful!</p>
    </div>
</body>

</html>
