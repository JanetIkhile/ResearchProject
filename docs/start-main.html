<!DOCTYPE html>
<html>

<head>
    <title>Start Main Session</title>
    <style>
        body, * {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e5e7eb;

            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .content {
            margin-top: clamp(140px, 18vh, 220px);
        }

        h1 {
            font-size: clamp(2.6rem, 5vw, 3.4rem);
            margin-bottom: 18px;
        }

        p {
            font-size: clamp(1.6rem, 3vw, 2rem);
            font-weight: 500;
            color: #374151;
            margin-bottom: 28px;
        }

        button {
            font-size: clamp(1.4rem, 3.5vw, 2rem);
            padding: clamp(18px, 4vw, 28px) clamp(32px, 6vw, 56px);

            font-weight: bold;
            background-color: #16a34a;
            color: white;
            border: none;
            border-radius: 14px;

            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="content">
            <h1>Start Main Session</h1>
            <p>You have completed the practice session.</p>

            <button onclick="goToDashboard()">
                Start Main Session
            </button>
        </div>
    </div>

    <script>
        function goToDashboard() {
            window.location.href = "dashboard/dashboard.html";
        }

        // Prevent long-press context menu globally
        document.addEventListener("contextmenu", function(e) { e.preventDefault(); });
    </script>
</body>

</html>
