<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Start Main Session</title>
    <style>
        @font-face {
            font-family: 'Selawik';
            src: url('assets/fonts/selawk.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Selawik';
            src: url('assets/fonts/selawkb.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        @font-face {
            font-family: 'Selawik';
            src: url('assets/fonts/selawkl.ttf') format('truetype');
            font-weight: 300;
            font-style: normal;
        }

        body, * {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        body {
            margin: 0;
            font-family: 'Selawik', Arial, Helvetica, sans-serif;
            background-color: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .content {
            margin-top: 0;
        }

        h1 {
            font-size: clamp(2.6rem, 5vw, 3.4rem);
            margin-bottom: 50px;
        }

        p {
            font-size: clamp(1.6rem, 3vw, 2rem);
            font-weight: 500;
            color: #374151;
            margin-bottom: 28px;
        }

        button {
            font-size: clamp(1.4rem, 3.5vw, 2rem);
            padding: clamp(18px, 4vw, 28px) clamp(32px, 6vw, 56px);

            font-family: inherit;
            font-weight: bold;
            background-color: #379777;
            color: white;
            border: none;
            border-radius: 14px;

            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2b765d;
        }

        @keyframes tapContinue {
            0% {
                transform: translateY(0) scale(1);
            }
            40% {
                transform: translateY(-32px) scale(1);
            }
            50% {
                transform: translateY(-28px) scale(0.8);
            }
            60% {
                transform: translateY(-32px) scale(1);
            }
            100% {
                transform: translateY(0) scale(1);
            }
        }

        .continue-pointer-animate {
            animation: tapContinue 2s infinite ease-in-out;
        }

        .hint-pointer {
            position: absolute;
            width: 60px;
            height: 60px;
            font-size: 54px;
            text-align: center;
            line-height: 60px;
            z-index: 3000;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="content">
            <h1>You have completed the practice session.</h1>

            <button onclick="goToDashboard()">
                Start Main Session
            </button>
        </div>
    </div>

    <script>
        function goToDashboard() {
            sessionStorage.setItem("session_type", "main");
            window.location.href = "dashboard/dashboard.html";
        }

        // Prevent long-press context menu globally
        document.addEventListener("contextmenu", function(e) { e.preventDefault(); });

        // Show animated helper hand pointing to the button after 2 seconds of inactivity
        window.addEventListener("load", () => {
            setTimeout(() => {
                const btn = document.querySelector("button");
                if (!btn) return;
                const rect = btn.getBoundingClientRect();
                
                const pointer = document.createElement("div");
                pointer.id = "continuePointer";
                pointer.className = "hint-pointer continue-pointer-animate";
                pointer.innerText = "👆";
                pointer.style.left = `${rect.left + rect.width / 2 - 30}px`;
                pointer.style.top = `${rect.top + rect.height / 2 + 15}px`;
                document.body.appendChild(pointer);
            }, 2000);
        });
    </script>
</body>

</html>
